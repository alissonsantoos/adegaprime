<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>try{var t=localStorage.getItem("adega_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adega Prime — PDV / Caixa</title>
  <meta name="theme-color" content="#0e0c09">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/pdv.css">
</head>
<body>
<header class="top">
  <img src="logo.png" alt="Adega Prime" class="brand" width="34">
  <nav id="tabs" aria-label="Seções">
    <button data-tab="venda" class="active">Venda</button>
    <button data-tab="caixa">Caixa</button>
    <button data-tab="estoque">Estoque</button>
    <button data-tab="vendas">Vendas</button>
    <button data-tab="relatorios">Relatórios</button>
    <button data-tab="config">Config</button>
  </nav>
  <span class="caixa-status" id="caixaStatus" role="status"></span>
  <span id="userChip" class="user-chip" hidden><span><b id="userNome"></b> <small id="userPapel" class="muted"></small></span><button class="btn sm" id="btnSair" type="button">Sair</button></span>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro"><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="btn sm" id="btnAjuda" type="button" aria-label="Ajuda (F1)">? Ajuda</button>
</header>

<main id="view"></main>

<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="cupom" aria-hidden="true"></div>
<footer class="keys" aria-label="Atalhos"><span><kbd>F1</kbd> Ajuda</span><span><kbd>F2</kbd> Buscar</span><span><kbd>F4</kbd> Finalizar</span><span><kbd>F8</kbd> Descartar</span><span><kbd>Esc</kbd> Fechar</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
